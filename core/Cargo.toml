[package]
name = "backstack_core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
flate2 = "1"
rusty-s3 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
ureq = "3"
url = "2"

[profile.release]
lto = true
panic = "abort"
